name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (clean, locked)
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Syntax check
        run: node --check index.js
      - name: Smoke test (stdio handshake + tools/list)
        run: npm test
